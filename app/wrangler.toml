name = "hacknet"
main = "worker/index.ts"
compatibility_date = "2024-09-23"

# Static assets (the built game) are served by the Worker's fallback path
# in worker/index.ts for any request that isn't /api/auth/*.
[assets]
directory = "./dist"
binding = "ASSETS"

# GOOGLE_CLIENT_ID is not secret — it's fine to commit. GOOGLE_CLIENT_SECRET
# and SESSION_SECRET are NOT here; they're set as encrypted secrets via
# `wrangler secret put` (or the dashboard), never committed.
[vars]
GOOGLE_CLIENT_ID = "570039485030-n9ptfmt6d320rdl0704gu5r10f5s1b39.apps.googleusercontent.com"

# Persistent saves, keyed by the signed-in Google account.
[[d1_databases]]
binding = "DB"
database_name = "hacknet-saves"
database_id = "7a9b3b13-0421-4a5e-9c9c-8e6d5bf12e13"
migrations_dir = "worker/migrations"
